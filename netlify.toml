[build]
  publish = "public"

# The service worker must never be cached by the browser or CDN,
# otherwise phones keep running an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Always fetch a fresh manifest so name/icon changes are picked up
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

